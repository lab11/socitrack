name: Documentation and browser tool

# One Pages site holds both: the documentation at the root, and the browser tool at /app/. A repository
# has one Pages site, so they are built and published together.
on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'software/managementweb/**'
      - 'software/firmware/src/**'
      - 'software/management/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it part-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: software/managementweb/package-lock.json

      - name: Check and build the browser tool
        working-directory: software/managementweb
        run: |
          npm ci
          npm run ci

      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Add the browser tool to the site
        run: sudo cp -r software/managementweb/app/dist _site/app

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
